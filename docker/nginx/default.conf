map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 64m;

    # 容器 IP 变化后重新解析 arguscms
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $cms_upstream http://arguscms:10000;
        proxy_pass $cms_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
    }

    location = /login { try_files /login.html =404; }
    location = /play { try_files /play.html =404; }
    location = /playback { try_files /playback.html =404; }
    location = /map { try_files /map.html =404; }
    location = /test { try_files /test.html =404; }

    location / {
        try_files $uri $uri/ =404;
    }
}
