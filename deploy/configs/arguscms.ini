; 容器内配置。宿主机 IP 由 compose 的 ARGUS_ADVERTISE_IP / ARGUS_SIP_HOST 注入。

[http]
port=10002
api_auth=1
live_stream_auth=0
captcha=0
logo_text=ArgusGBS
logo_mini_text=GBS
copyright_text=ArgusGBS
www_dir=

[db]
file=/data/argus.db

[redis]
; Compose 里的 Redis 监听该端口。同机连 127.0.0.1，其它机器的流媒体用宿主机 IP。
host=127.0.0.1
port=26380
password=argus@2024

[sip]
host=192.168.3.41
port=15060
serial=34020000002000000001
realm=3402000000
ack_timeout=15
keepalive_timeout=300
device_password=gbs12345
log=1
allow_stream_start_by_url=1
drop_channel_type=134,135,136,137
device_default_media_transport=UDP
device_default_media_transport_mode=passive
channel_default_ondemand=1
channel_default_cloud_record=0
charset=GB2312
prefer_stream_fmt=FLV

[sms]
host=127.0.0.1
http_port=10001
serial=34020000002020000001
realm=3402000000
sip_port=15070
rtmp_port=1935
rtsp_port=554
api_secret=argus-sms

[map]
enable=0
center=117.30592,32.01789
