; ArgusCMS 信令服务配置。字段含义对齐 LiveCMS livecms.ini，便于对照。

[http]
port=10000
; 接口鉴权(0-关闭, 1-开启)
api_auth=1
; 流地址鉴权(0-关闭, 1-开启)
live_stream_auth=0
; 登录图形验证码(0-关闭, 1-开启)
captcha=0
logo_text=ArgusGBS
logo_mini_text=GBS
copyright_text=ArgusGBS
; 管理页由 argusweb 提供，信令不再挂静态目录
www_dir=
; 播放地址对外主机，留空则使用浏览器访问的 Host
public_host=

[https]
; port=10010
; ssl_cert_file=ssl/localhost_cert.pem
; ssl_key_file=ssl/localhost_key.pem

[db]
; sqlite 文件路径
file=data/argus.db

[sip]
; 信令监听地址，留空表示自动探测本机出口 IP，设备注册时仍按实际来源回包
host=
port=15060
serial=34020000002000000001
realm=3402000000
ack_timeout=15
keepalive_timeout=300
device_password=gbs12345
log=1
allow_stream_start_by_url=1
drop_channel_type=134,135,136,137
device_default_media_transport=UDP
device_default_media_transport_mode=passive
channel_default_ondemand=1
channel_default_cloud_record=0
; 下发给设备的 MANSCDP 字符集: GB2312 或 UTF-8
charset=GB2312
; 播放鉴权回调, HTTP GET, 200 通过
stream_auth_url=
prefer_stream_fmt=FLV

[sms]
; 流媒体控制面
host=127.0.0.1
http_port=10001
serial=34020000002020000001
realm=3402000000
sip_port=15070
rtmp_port=1935
rtsp_port=554
public_host=
api_secret=argus-sms

[map]
enable=0
center=117.30592,32.01789
